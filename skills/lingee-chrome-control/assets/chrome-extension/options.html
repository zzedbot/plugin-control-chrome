<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingee Chrome Agent Bridge Settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="wide">
      <h1>Lingee Chrome Agent Bridge Settings</h1>
      <p>The native host enforces the authoritative allowlist. These settings add a second extension-side blocklist.</p>
      <label><input id="enabled" type="checkbox" /> Enable browser control</label>
      <label for="blocked">Extension-side blocked hosts, one per line</label>
      <textarea id="blocked" rows="10" placeholder="bank.example.com"></textarea>
      <button id="save" type="button">Save</button>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
